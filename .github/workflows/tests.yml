name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tbpipeline_bf/requirements.txt -r tbpipeline_newl/requirements.txt -r tbpipeline_neww/requirements.txt
      - run: python3 -m unittest discover -s tests -t .
